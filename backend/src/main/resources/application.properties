spring.application.name=airline-backend
server.port=8080

# ---- Database (password comes from an environment variable, never written in code) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/airline_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Hibernate creates/updates the tables automatically from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ---- JWT secret (set JWT_SECRET in real deployments; this default is only for local demo) ----
app.jwt.secret=${JWT_SECRET:local-demo-secret-change-me-0123456789-abcdefghij}
